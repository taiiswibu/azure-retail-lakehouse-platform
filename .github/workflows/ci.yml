name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Static validation
        run: python tools/validate_project.py
      - name: Ruff
        run: ruff check src generators tools tests
      - name: Compile Databricks notebooks
        run: python -m compileall notebooks src generators tools
      - name: Tests
        run: pytest --cov=retail_lakehouse --cov-report=term-missing

