[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-retail-lakehouse"
version = "1.0.0"
description = "On-demand Azure Databricks lakehouse portfolio project for multi-source e-commerce data"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{name = "Vo Van Tai"}]
dependencies = []

[project.optional-dependencies]
producer = ["azure-eventhub>=5.12,<6"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "pyspark==3.5.2",
  "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["spark: tests requiring a local Spark session"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

